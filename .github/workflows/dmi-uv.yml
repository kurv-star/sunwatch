name: Fetch DMI UV

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min — GitHub may run this a bit late, that's fine
  workflow_dispatch:          # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch DMI data (server-side, no CORS)
        run: |
          mkdir -p data
          TODAY=$(curl -sf "https://www.dmi.dk/dmidk_byvejrWS/rest/json/nuv_clear_cloud") || TODAY=""
          MAX=$(curl -sf "https://www.dmi.dk/dmidk_byvejrWS/rest/json/id/2619528") || MAX=""
          if [ -z "$TODAY" ] || [ -z "$MAX" ]; then
            echo "One or both DMI endpoints failed or returned empty — leaving the last good data/dmi.json in place."
            exit 0
          fi
          node -e "
            const fs=require('fs');
            const today=JSON.parse(process.argv[1]);
            const max=JSON.parse(process.argv[2]);
            fs.writeFileSync('data/dmi.json', JSON.stringify({fetched_at: Date.now(), today, max}));
          " "$TODAY" "$MAX"

      - name: Commit if changed
        run: |
          git config user.name "dmi-bot"
          git config user.email "actions@github.com"
          git add data/dmi.json
          git diff --staged --quiet || git commit -m "DMI UV update $(date -u +%FT%TZ)"
          git push
